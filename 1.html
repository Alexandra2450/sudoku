    <script>  

        let levels = {
            easy: [
                2344234253453454, 3423433453453, 3453453453453
            ],
            medium: [],
            hard: []
        }

        let selectCell = [0, 0, false];  
        let indstr = 0, indcol = 0; numBlock = 0;
        $(".container-sudoku-block-item").each(function(index) {
            $(this).attr("data-i", indstr);
            $(this).attr("data-j", indcol);
            $(this).attr("data-block", numBlock);
            indcol++;
            if(indcol % 3 == 0) {
                indcol = indcol - 3;
                indstr++;
            }
            if(indcol % 3 == 0 && indstr % 3 == 0){
                numBlock++;
                indstr = Math.floor(numBlock / 3) * 3;
                indcol = Math.floor(numBlock % 3) * 3;
            }   
        });

        let matrSudoku = [];
        for(let i = 0; i < 9; i++) {
            matrSudoku[i] = [];
            for(let j = 0; j < 9; j++) {
                matrSudoku[i][j] = 0;
            }
        }

        function getRandomInt(max) {
            return Math.floor(Math.random() * max);
        }

        function generateField(n){
            let startField = [];
            for(let i = 0; i < n; i++){
                flag = false;
                let curInd = 0;
                while(flag==false){
                    curInd = getRandomInt(81);
                    if(startField.includes(curInd) == false){
                        flag = true;
                        startField.push(curInd)
                    }
                }
            }
            return startField;
        }

        

        function checkRow(num, indX, indY){
            let flag = true;
            for(let i=0; i<9; i++){
                if(matrSudoku[indX][i] == num){
                    flag = false;
                }
            }
            return flag;
        }

        function checkCol(num, indX, indY){
            let flag = true;
            for(let i=0; i<9; i++){
                if(matrSudoku[i][indY] == num){
                    flag = false;
                }
            }
            return flag;
        }

        function checkBlock(num, indX, indY){
            let flag = true;
            let checkBlock = $(".container-sudoku-block-item[data-i='" + indX + "'][data-j='" + indY + "']").attr("data-block");
            for(let i = 0; i < 9; i++) {
                for(let j = 0; j < 9; j++) {
                    let curBlock = $(".container-sudoku-block-item[data-i='" + i + "'][data-j='" + j + "']").attr("data-block");
                    if(curBlock == checkBlock && matrSudoku[i][j] == num){
                        flag = false;
                    }
                }
            }
            return flag;
        }

        function generateArrayTrue(){
            for(let i = 0; i < 9; i++) {
                for(let j = 0; j < 9; j++) {
                    let flag = false;
                    for(let k = 1; k < 500; k++){
                        if(flag == true){
                            break;
                        }
                        let num = getRandomInt(9) + 1;
                        if(checkRow(num, i, j) && checkCol(num, i, j) && checkBlock(num, i, j)){
                            matrSudoku[i][j] = num;
                            flag = true;
                        }
                    }
                    if(matrSudoku[i][j] == 0){
                        return false;
                    }
   
                }
            }
            return true;
        }
        
        for(let i = 0; i < 1000; i++){
            let res = generateArrayTrue();
            writeMatrixToString(matrSudoku);
            if(res == false){
                for(let i = 0; i < 9; i++) {
                    for(let j = 0; j < 9; j++) {
                        matrSudoku[i][j] = 0;
                    }
                }

            } else {
                break;
            }
        }

        let generateFieldInd = generateField(25);
        for(let i = 0; i < generateFieldInd.length; i++){
            let curi = Math.floor(generateFieldInd[i] / 9);
            let curj = generateFieldInd[i] % 9;
            //$(".container-sudoku-block-item[data-i='" + curi + "'][data-j='" + curj + "']").addClass("podsvetka").text(matrSudoku[curi][curj]);
            $(".container-sudoku-block-item[data-i='" + curi + "'][data-j='" + curj + "']").text(matrSudoku[curi][curj]).attr("data-const", 1);
        }

        console.log(generateFieldInd);
        console.log(matrSudoku);

        $(".container-sudoku-block-item").on("click", function(){
            const numBlock = $(this).attr("data-block");
            const indX = $(this).attr("data-i");
            const indY = $(this).attr("data-j");
            const curText = $(this).text();
            console.log(curText);
            $(".container-sudoku-block-item").removeClass("block-highlight");
            $(".container-sudoku-block-item").removeClass("current-cell-highlight");
            $(".container-sudoku-block-item").removeClass("current-text-hightlight");
            $(".container-sudoku-block-item[data-block='" + numBlock + "']").addClass("block-highlight");
            $(".container-sudoku-block-item[data-i='" + indX + "']").addClass("block-highlight");
            $(".container-sudoku-block-item[data-j='" + indY + "']").addClass("block-highlight");
            $(".container-sudoku-block-item[data-i='" + indX + "'][data-j='" + indY + "']").addClass("current-cell-highlight");
            if(curText != ""){
                $(".container-sudoku-block-item:contains('" + curText + "')").addClass("current-text-hightlight")
            }
            if($(this).attr("data-const") == 1){
                selectCell = [indX, indY, false];
            }
            else{
                selectCell = [indX, indY, true];
            }
        });

        $(".start-game-button").on("click", function(){
            window.location.reload();
        });

        $(".selection-number").on("click", function(){
            let num = $(this).text();
            console.log(num);
            if(selectCell[2] == true){
                if(num == matrSudoku[selectCell[0]][selectCell[1]]){
                    $(".container-sudoku-block-item[data-i='" + selectCell[0] + "'][data-j='" + selectCell[1] + "']").text(num).removeClass("red-flag").addClass("green-flag").attr("data-const", 1);
                    selectCell = [0, 0, false];
                } else {
                    $(".container-sudoku-block-item[data-i='" + selectCell[0] + "'][data-j='" + selectCell[1] + "']").text(num).removeClass("green-flag").addClass("red-flag");
                }
            }
        });

        // Запускаем музыку при первом клике пользователя на странице
        $(document).one("click", function() {
            const music = document.getElementById("background-music");
            music.play().catch(e => console.error("Не удалось воспроизвести музыку:", e));
        });

        

        function writeMatrixToString(matrSudoku) {
            let str = "";
            for(let i = 0; i < 9; i++) {
                for(let j = 0; j < 9; j++) {
                    str += matrSudoku[i][j];
                }
            }
            console.log(str);
            return str;
        }
