        //по умолчанию уровень легкий

        let randNumber = getRandomInt(29);

        let minutes = 0;
        let seconds = 0;
        let timerInterval;


        let setMatrix = ["213645897689217435457938261521863749796451382348729516875396124162584973934172658",

                        "748962153159384627236715894815439762697258431324671589463597218982146375571823946", 
                        "158239647746158239932467185327814596689725314514693872895372461471586923263941758", 
                        "962137584814625739573948621459863217137592846286714953621459378795381462348276195", 
                        "238579416617248395459361782124793658983654271576182934395826147761435829842917563", 
                        "362795418415268973798341526649532187873619254521874639136957842257486391984123765", 
                        "592138746816754932743269158451893627927615384638472591374586219269341875185927463", 
                        "863512497249687153175943286436851729527369814918724635681435972392176548754298361", 
                        "745329186386417592129856374837542961461973258592681743674235819953168427218794635", 
                        "264379851517682439839451762975234618682917345143568297491723586758146923326895174", 
                        "954823761172659384836741259698174523427538196315962847563297418241386975789415632", 
                        "348721956129654378567983214285396741794815623613247895956432187831579462472168539", 
                        "764523981123897465598461237451376829839152674276948153382714596947685312615239748", 
                        "765813942914267385823945671571692834398754216642381597257439168136578429489126753", 
                        "178593624493261758256487193932175846841632975567948231314726589785319462629854317", 
                        "718963254542718963639425178983247615274156389165389742826591437457632891391874526", 
                        "629471358435892617781365924273958461198643572546217893354126789817539246962784135", 
                        "613587942245396178789124356851469723436752891927831465368945217192678534574213689", 
                        "652973184743815629918264537325489761861527943497136852174358296289641375536792418", 
                        "128349576674521389395867124916258437487693215253714698861935742742186953539472861", 
                        "975612834863945172412387659586491723724538961139276485258164397347859216691723548", 
                        "452736198836914527917582364378261459645897213129345876783159642594628731261473985", 
                        "896415372735296148214738569967352814328149756451687293142563987683971425579824631", 
                        "617482935928735641435691782276843159351279468894156327762318594543927816189564273", 
                        "781652934932487651546931728418723596265819473397564812824375169673198245159246387"];


        let tempStr = setMatrix[randNumber];
        
        let selectCell = [0, 0, false];  
        let indstr = 0, indcol = 0; numBlock = 0;

        $(".container-sudoku-block-item").each(function(index) {
            $(this).attr("data-i", indstr);
            $(this).attr("data-j", indcol);
            $(this).attr("data-block", numBlock);
            indcol++;
            if(indcol % 3 == 0) {
                indcol = indcol - 3;
                indstr++;
            }
            if(indcol % 3 == 0 && indstr % 3 == 0){
                numBlock++;
                indstr = Math.floor(numBlock / 3) * 3;
                indcol = Math.floor(numBlock % 3) * 3;
            }   
        });

        let matrSudoku = [];
        for(let i = 0; i < 9; i++) {
            matrSudoku[i] = [];
            for(let j = 0; j < 9; j++) {
                matrSudoku[i][j] = parseInt(tempStr[i * 9 + j]);
            }
        }

        function getRandomInt(max) {
            return Math.floor(Math.random() * max);
        }

        function generateField(n){
            let startField = [];
            for(let i = 0; i < n; i++){
                flag = false;
                let curInd = 0;
                while(flag==false){
                    curInd = getRandomInt(81);
                    if(startField.includes(curInd) == false){
                        flag = true;
                        startField.push(curInd)
                    }
                }
            }
            return startField;
        }
        
        function startGame(currentLevel) {
            clearInterval(timerInterval);
            minutes = 0;
            seconds = 0;
            $("#game-timer").text("00:00");
            $(".container-sudoku-block-item").text("").removeAttr("data-const").removeClass("green-flag red-flag");

            // Выбираем новую случайную матрицу
            randNumber = getRandomInt(30); // Исправлено на 30
            tempStr = setMatrix[randNumber];
            for(let i = 0; i < 9; i++) {
                for(let j = 0; j < 9; j++) {
                    matrSudoku[i][j] = parseInt(tempStr[i * 9 + j]);
                }
            }

            // Генерируем и отображаем начальные цифры
            let generateFieldInd = generateField(currentLevel);
            generateFieldInd.forEach(index => {
                const curi = Math.floor(index / 9);
                const curj = index % 9;
                $(".container-sudoku-block-item[data-i='" + curi + "'][data-j='" + curj + "']").text(matrSudoku[curi][curj]).attr("data-const", 1);
            });

            startTimer(); // Запускаем таймер заново
        }

        // Первый запуск игры
        startGame(level);
        
        $(".container-sudoku-block-item").on("click", function(){
            const numBlock = $(this).attr("data-block");
            const indX = $(this).attr("data-i");
            const indY = $(this).attr("data-j");
            const curText = $(this).text();
            console.log(curText);
            $(".container-sudoku-block-item").removeClass("block-highlight");
            $(".container-sudoku-block-item").removeClass("current-cell-highlight");
            $(".container-sudoku-block-item").removeClass("current-text-hightlight");
            $(".container-sudoku-block-item[data-block='" + numBlock + "']").addClass("block-highlight");
            $(".container-sudoku-block-item[data-i='" + indX + "']").addClass("block-highlight");
            $(".container-sudoku-block-item[data-j='" + indY + "']").addClass("block-highlight");
            $(".container-sudoku-block-item[data-i='" + indX + "'][data-j='" + indY + "']").addClass("current-cell-highlight");
            if(curText != ""){
                $(".container-sudoku-block-item:contains('" + curText + "')").addClass("current-text-hightlight")
            }
            if($(this).attr("data-const") == 1){
                selectCell = [indX, indY, false];
            }
            else{
                selectCell = [indX, indY, true];
            }
        });

        $(".start-game-button").on("click", function(){
            startGame(level); // Перезапускаем игру с текущим уровнем
        });

        $(".selection-number").on("click", function(){
            let num = $(this).text();
            console.log(num);
            if(selectCell[2] == true){
                if(num == matrSudoku[selectCell[0]][selectCell[1]]){
                    $(".container-sudoku-block-item[data-i='" + selectCell[0] + "'][data-j='" + selectCell[1] + "']").text(num).removeClass("red-flag").addClass("green-flag").attr("data-const", 1);
                    selectCell = [0, 0, false];
                } else {
                    $(".container-sudoku-block-item[data-i='" + selectCell[0] + "'][data-j='" + selectCell[1] + "']").text(num).removeClass("green-flag").addClass("red-flag");
                }
            }
        });

        // --- Логика попапа настроек ---
        // Открыть попап
        $(".setting-icon").on("click", function() {
            $("#settings-popup").addClass("show");
        });

        // Закрыть попап по клику на крестик
        $(".close-popup-btn").on("click", function() {
            $("#settings-popup").removeClass("show");
        });

        // Закрыть попап по клику на фон
        $("#settings-popup").on("click", function(event) {
            if (event.target === this) {
                $(this).removeClass("show");
            }
        });

        $(document).one("click", function() {
            const music = document.getElementById("background-music");
            $("#background-music")[0].volume = $("#volume-slider").val() / 100; // Устанавливаем начальную громкость
            music.play().catch(e => console.error("Не удалось воспроизвести музыку:", e));
        });
        
        // Регулятор громкости
        $("#volume-slider").on("input", function() {
            $("#background-music")[0].volume = $(this).val() / 100;
        });

        function startTimer() {
            clearInterval(timerInterval); // На всякий случай очищаем старый интервал
            timerInterval = setInterval(() => {
                seconds++;
                if (seconds >= 60) {
                    seconds = 0;
                    minutes++;
                }

                let formattedMinutes = minutes < 10 ? "0" + minutes : minutes;
                let formattedSeconds = seconds < 10 ? "0" + seconds : seconds;

                $("#game-timer").text(`${formattedMinutes}:${formattedSeconds}`);
            }, 1000);
        }


        
        $(".section-levels-item").on("click", function(){
            $(".section-levels-item").removeClass("current-level");
            $(this).addClass("current-level");
            if($(this).text() == "Тишина"){
                level = 30;
            }
            if($(this).text() == "Пробуждение"){
                level = 25;
            }
            if($(this).text() == "Просвещение"){
                level = 20;
            }
            startGame(level);
        });



    
    
    </script>
