  <!-- Сам ластик -->
  <path 
    d="M8 18 L24 10 L40 18 L24 26 Z" 
    fill="white" 
    stroke="black" 
    stroke-width="2" 
    stroke-linejoin="round" 
    stroke-linecap="round"
  />
</svg>
