<svg width="60" height="60" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Линии, имитирующие текст -->
  <path d="M4 28 H44 M4 34 H44" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round"/>

  <!-- "Стертый" след за ластиком (белый прямоугольник без обводки, который перекрывает текст) -->
